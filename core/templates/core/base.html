<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FarmPro{% endblock %}</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f6f8f6;

            color: #1f2937;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            height: 72px;

            background: #ffffff;

            border-bottom: 1px solid #e5e7eb;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 5%;

            position: sticky;

            top: 0;

            z-index: 1000;
        }


        /* Logo */

        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            text-decoration: none;

            color: #166534;

            font-size: 24px;

            font-weight: 800;

            letter-spacing: -0.5px;
        }


        .logo-icon {

            width: 40px;

            height: 40px;

            background: #dcfce7;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;
        }


        /* Navbar Right */

        .navbar-right {

            display: flex;

            align-items: center;

            gap: 25px;
        }


        /* Navigation */

        .navigation {

            display: flex;

            align-items: center;

            gap: 25px;
        }


        .navigation a {

            text-decoration: none;

            color: #4b5563;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s;
        }


        .navigation a:hover {

            color: #15803d;
        }


        /* Dashboard title */

        .dashboard-title {

            color: #166534;

            font-size: 14px;

            font-weight: 700;
        }


        /* User */

        .user-area {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .avatar {

            width: 38px;

            height: 38px;

            background: #dcfce7;

            color: #166534;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: 800;

            font-size: 14px;
        }


        .user-info {

            display: flex;

            flex-direction: column;
        }


        .user-name {

            font-size: 14px;

            font-weight: 700;

            color: #111827;
        }


        .user-role {

            font-size: 11px;

            color: #6b7280;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }


        /* Logout */

        .logout {

            text-decoration: none;

            color: #dc2626;

            font-size: 14px;

            font-weight: 700;

            padding: 9px 15px;

            border: 1px solid #fecaca;

            border-radius: 8px;

            transition: 0.2s;
        }


        .logout:hover {

            background: #fef2f2;
        }


        /* =========================
           MAIN
        ========================= */

        .container {

            max-width: 1200px;

            margin: auto;

            padding: 45px 25px;
        }


        /* =========================
           HERO
        ========================= */

        .hero {

            background:

                linear-gradient(
                    135deg,
                    #166534,
                    #15803d
                );

            border-radius: 20px;

            padding: 40px;

            color: white;

            margin-bottom: 30px;

            position: relative;

            overflow: hidden;
        }


        .hero::after {

            content: "🌾";

            position: absolute;

            right: 50px;

            bottom: -20px;

            font-size: 150px;

            opacity: 0.12;
        }


        .hero h1 {

            font-size: 32px;

            margin-bottom: 10px;

            position: relative;

            z-index: 1;
        }


        .hero p {

            max-width: 650px;

            line-height: 1.7;

            color: #dcfce7;

            position: relative;

            z-index: 1;
        }


        /* =========================
           STATISTICS
        ========================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 30px;
        }


        .stat-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            padding: 22px;

            transition: 0.2s;
        }


        .stat-card:hover {

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.06);
        }


        .stat-icon {

            font-size: 25px;

            margin-bottom: 12px;
        }


        .stat-title {

            color: #6b7280;

            font-size: 13px;

            margin-bottom: 5px;
        }


        .stat-value {

            font-size: 26px;

            font-weight: 800;

            color: #111827;
        }


        /* =========================
           SECTION
        ========================= */

        .section-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 18px;
        }


        .section-header h2 {

            font-size: 20px;

            color: #111827;
        }


        .section-header p {

            color: #6b7280;

            font-size: 13px;
        }


        /* =========================
           CARDS
        ========================= */

        .cards {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }


        .card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 16px;

            padding: 25px;

            transition: 0.25s;
        }


        .card:hover {

            transform: translateY(-4px);

            box-shadow:
                0 12px 30px
                rgba(0,0,0,0.07);
        }


        .card-icon {

            width: 50px;

            height: 50px;

            background: #dcfce7;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

            margin-bottom: 18px;
        }


        .card h2 {

            font-size: 18px;

            margin-bottom: 10px;

            color: #111827;
        }


        .card p {

            color: #6b7280;

            line-height: 1.6;

            font-size: 14px;
        }


        /* Button */

        .button {

            display: inline-block;

            margin-top: 18px;

            padding: 10px 18px;

            background: #166534;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-size: 13px;

            font-weight: 700;

            transition: 0.2s;
        }


        .button:hover {

            background: #14532d;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            text-align: center;

            padding: 30px;

            color: #9ca3af;

            font-size: 13px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 1000px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .navigation {

                display: none;
            }

        }


        @media (max-width: 700px) {

            .navbar {

                padding: 0 20px;
            }


            .user-info {

                display: none;
            }


            .logout {

                padding: 7px 10px;
            }


            .container {

                padding: 25px 15px;
            }


            .hero {

                padding: 30px 25px;
            }


            .hero h1 {

                font-size: 25px;
            }


            .stats {

                grid-template-columns: 1fr;
            }


            .cards {

                grid-template-columns: 1fr;
            }

        }


        /* #additional  */
        /* Form controls */

input,
select,
textarea {

    width: 100%;

    padding: 12px 14px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    font-size: 14px;

    font-family: inherit;

    outline: none;

    background: #ffffff;

    transition: 0.2s;
}


input:focus,
select:focus,
textarea:focus {

    border-color: #15803d;

    box-shadow:
        0 0 0 3px rgba(21, 128, 61, 0.10);
}


    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">


        <!-- Brand -->

        <a href="#" class="logo">

            <span class="logo-icon">
                🌾
            </span>

            FarmPro

        </a>


        <!-- Right -->

        <div class="navbar-right">


            <div class="navigation">

                {% block navigation %}

                {% endblock %}

            </div>


            <!-- User -->

            <div class="user-area">

                <div class="avatar">

                    {{ request.user.full_name|first|upper }}

                </div>


                <div class="user-info">

                    <span class="user-name">

                        {{ request.user.full_name }}

                    </span>

                    <span class="user-role">

                        {{ request.user.user_type }}

                    </span>

                </div>

            </div>


            <!-- Logout -->

            <a
                href="{% url 'logout' %}"
                class="logout"
            >

                Logout

            </a>

        </div>

    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="container">

        {% block content %}

        {% endblock %}

    </main>


    <!-- Footer -->

    <footer class="footer">

        © 2026 FarmPro · Connecting Agriculture with Opportunity 🌱

    </footer>


</body>

</html>
